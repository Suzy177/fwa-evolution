<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWL | FWA Evolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/stathut-v2.css">
  <link rel="icon" type="image/png" href="/assets/fwa-evolution-logo.png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GJLXJW3G7H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GJLXJW3G7H');
  </script>

  <style>
    :root { --cwl-a1: #fb7185; --cwl-a2: #e11d48; }
    .cwl-wrap { max-width: 1180px; margin: 0 auto; }
    .cwl-title-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .cwl-title-row h1 { margin: 0; font-family: "Orbitron", sans-serif; font-size: 1.6rem; color: var(--text); }
    .cwl-sub { color: var(--text-dim); font-size: .86rem; margin: 4px 0 0; }
    .cwl-modes { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .cwl-mode {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
      font-weight: 800; font-size: .86rem; padding: 10px 20px; border-radius: 12px; cursor: pointer;
    }
    .cwl-mode.active { background: linear-gradient(135deg, var(--cwl-a1), var(--cwl-a2)); color: #0a0e1a; border-color: transparent; }
    .cwl-hero {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 20px; margin-bottom: 18px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px; position: relative; overflow: hidden;
    }
    .cwl-hero::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(180deg, var(--cwl-a1), var(--cwl-a2)); }
    .cwl-hero img { width: 64px; height: 64px; object-fit: contain; }
    .cwl-hero-name { font-size: 1.25rem; font-weight: 800; color: var(--text); }
    .cwl-hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .cwl-chip { font-size: .72rem; padding: 4px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); font-weight: 700; }
    .cwl-chip.live { color: var(--cwl-a1); border-color: var(--cwl-a1); }
    .cwl-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; }
    @media (max-width: 860px) { .cwl-grid { grid-template-columns: 1fr; } }
    .cwl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; min-width: 0; }
    .cwl-card-title { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); font-weight: 800; margin-bottom: 12px; }
    .cwl-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: .86rem; }
    .cwl-row:last-child { border-bottom: none; }
    .cwl-row.dim { opacity: .5; }
    .cwl-r { font-weight: 800; color: var(--text-dim); font-size: .74rem; }
    .cwl-opp { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text); }
    .cwl-opp img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
    .cwl-opp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cwl-res { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--text-dim); white-space: nowrap; }
    .res { font-size: .66rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); }
    .res.win { color: #34d399; border-color: rgba(52,211,153,.5); }
    .res.loss { color: #f87171; border-color: rgba(248,113,113,.5); }
    .res.tie { color: #facc15; border-color: rgba(250,204,21,.5); }
    .res.live { color: var(--cwl-a1); border-color: var(--cwl-a1); }
    .cwl-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    .cwl-table th { text-align: right; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); padding: 4px 6px 8px; }
    .cwl-table th:nth-child(1), .cwl-table th:nth-child(2) { text-align: left; }
    .cwl-table td { padding: 8px 6px; border-top: 1px solid rgba(255,255,255,.05); text-align: right; color: var(--text); white-space: nowrap; }
    .cwl-table td:nth-child(1) { text-align: left; color: var(--text-dim); font-weight: 800; width: 26px; }
    .cwl-table td:nth-child(2) { text-align: left; }
    .cwl-table .nm { display: flex; align-items: center; gap: 8px; max-width: 220px; }
    .cwl-table .nm img { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
    .cwl-table .nm span { overflow: hidden; text-overflow: ellipsis; }
    .cwl-table tr.us td { background: rgba(251,113,133,.08); }
    .cwl-table tr.us td:first-child { box-shadow: inset 3px 0 0 var(--cwl-a1); }
    .cwl-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .th-row { display: grid; grid-template-columns: 46px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05); align-items: center; }
    .th-row:last-child { border-bottom: none; }
    .th-row img { width: 44px; height: 44px; object-fit: contain; }
    .th-top { display: flex; justify-content: space-between; align-items: baseline; font-size: .86rem; color: var(--text); font-weight: 800; }
    .th-top span { font-size: .72rem; color: var(--text-dim); font-weight: 700; }
    .th-bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.07); margin: 6px 0 7px; overflow: hidden; }
    .th-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cwl-a2), var(--cwl-a1)); }
    .th-names { display: flex; flex-wrap: wrap; gap: 5px; }
    .th-names em { font-style: normal; font-size: .68rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); }
    .cwl-sort { display: inline-flex; gap: 4px; }
    .cwl-sort button { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); font-size: .66rem; font-weight: 800; letter-spacing: .04em; text-transform: none; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
    .cwl-sort button.active { background: linear-gradient(135deg, var(--cwl-a1), var(--cwl-a2)); color: #0a0e1a; border-color: transparent; }
    .cwl-table td.rk1 { color: #facc15; } .cwl-table td.rk2 { color: #cbd5e1; } .cwl-table td.rk3 { color: #fb923c; }
    .cwl-table tbody tr { transition: background .2s; }
    .mv { font-size: .6rem; margin-left: 4px; font-weight: 800; }
    .mv.up { color: #34d399; } .mv.down { color: #f87171; }
    .cwl-table tr.flash td { animation: cwlflash 3s ease-out; }
    @keyframes cwlflash { from { background: rgba(250,204,21,.28); } to { background: transparent; } }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; margin-right: 6px; box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: cwlpulse 1.8s infinite; }
    @keyframes cwlpulse { 70% { box-shadow: 0 0 0 7px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }
    .cwl-note { font-size: .86rem; color: var(--text-dim); padding: 22px 6px; text-align: center; line-height: 1.5; }
    .cwl-note a { color: var(--cwl-a1); font-weight: 700; text-decoration: none; }
    .cwl-updated { font-size: .74rem; color: var(--text-dim); }
    @media (max-width: 560px) { .cwl-table .nm { max-width: 130px; } .cwl-table th, .cwl-table td { padding-left: 4px; padding-right: 4px; } }
    .hist-card { margin-top: 16px; }
    .hist-item { border-top: 1px solid rgba(255,255,255,.06); }
    .hist-item:first-of-type { border-top: none; }
    .hist-item summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 2px; color: var(--text); font-weight: 800; font-size: .92rem; }
    .hist-item summary::-webkit-details-marker { display: none; }
    .hist-item summary::before { content: "\25B8"; color: var(--text-dim); font-size: .8rem; transition: transform .15s; }
    .hist-item[open] summary::before { transform: rotate(90deg); }
    .hist-sum { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .hist-body { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 4px 2px 16px; }
    @media (max-width: 760px) { .hist-body { grid-template-columns: 1fr; } }
    .hist-sub { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 4px; font-weight: 800; }
    .hist-top { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: .84rem; color: var(--text); }
    .hist-top:last-child { border-bottom: none; }
    .hist-top b { color: var(--text-dim); }
    .hist-top span.s { color: var(--text-dim); white-space: nowrap; font-size: .78rem; }
  </style>
</head>
<body class="sh2">

  <header class="sh2-topbar">
    <a href="/" class="sh2-logo"><img src="/assets/fwa-evolution-logo.png" alt="FWA Evolution">FWA Evolution</a>
    <nav class="sh2-nav">
      <a href="/">Home</a>
      <a href="/family.html">Family</a>
      <a href="/clans.html">Clans</a>
      <a href="/fwa-war-status.html">War Status</a>
      <a href="/cwl.html" class="active">CWL</a>
      <a href="/rules.html">Rules</a>
      <a href="/fwa-guide.html">Guide</a>
      <a href="/base-guide.html">Bases</a>
      <a href="/join.html">Join</a>
    </nav>
  </header>

  <section class="sh2-section">
    <div class="cwl-wrap">
      <div class="cwl-title-row">
        <div>
          <h1>Clan War League</h1>
          <p class="cwl-sub">Live rounds and roster performance for our serious and casual CWL clans.</p>
        </div>
        <span class="cwl-updated" id="cwlUpdated"></span>
      </div>

      <div class="cwl-modes" id="cwlModes">
        <button class="cwl-mode active" data-mode="serious">Serious CWL</button>
        <button class="cwl-mode" data-mode="casual">Casual CWL</button>
      </div>

      <div id="cwlView"><div class="cwl-note">Loading CWL…</div></div>
      <div id="cwlHistory"></div>
    </div>
  </section>

  <footer class="sh2-footer">
    <a href="https://stathut.in/">&larr; Back to StatHut Home</a>
    <div class="sh2-visitor-stat" id="sh2VisitorStat"></div>
  </footer>

  <script>
  (function () {
    const API = "https://api.stathut.in/api/cwl/";
    const ACCENT = { serious: ["#fb7185", "#e11d48"], casual: ["#34d399", "#10b981"] };
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const cache = {};
    let mode = "serious";

    function setAccent(m) {
      document.documentElement.style.setProperty("--cwl-a1", ACCENT[m][0]);
      document.documentElement.style.setProperty("--cwl-a2", ACCENT[m][1]);
    }

    function badge(url) { return url ? `<img src="${esc(url)}" alt="" onerror="this.style.visibility='hidden'">` : ""; }

    function heroHtml(d, extra) {
      const c = d.clan || {};
      return `<div class="cwl-hero">
        ${c.badge ? `<img src="${esc(c.badge)}" alt="">` : ""}
        <div>
          <div class="cwl-hero-name">${esc(c.name || "CWL clan")}</div>
          <div class="cwl-hero-meta">
            ${c.tag ? `<span class="cwl-chip">${esc(c.tag)}</span>` : ""}
            ${c.level ? `<span class="cwl-chip">Level ${esc(c.level)}</span>` : ""}
            ${c.league ? `<span class="cwl-chip">${esc(c.league)}</span>` : ""}
            ${extra || ""}
          </div>
        </div>
      </div>`;
    }

    const STATE_LABEL = { preparation: "Preparation day", inWar: "Battle day", warEnded: "Round ended", ended: "Season ended" };

    function resultOf(r) {
      if (r.state !== "warEnded") return null;
      const a = r.us || {}, b = r.opponent || {};
      if ((a.stars || 0) !== (b.stars || 0)) return (a.stars || 0) > (b.stars || 0) ? "win" : "loss";
      const da = a.destructionPercentage || 0, db = b.destructionPercentage || 0;
      return da === db ? "tie" : da > db ? "win" : "loss";
    }

    function roundsHtml(d) {
      const rounds = d.rounds || [];
      const total = d.roundsTotal || 7;
      let html = rounds.map(r => {
        const o = r.opponent || {}, u = r.us || {};
        const res = resultOf(r);
        const chip = res ? `<span class="res ${res}">${res === "win" ? "WIN" : res === "loss" ? "LOSS" : "TIE"}</span>`
          : `<span class="res live">${r.state === "preparation" ? "PREP" : "LIVE"}</span>`;
        return `<div class="cwl-row"><span class="cwl-r">R${esc(r.round)}</span>
          <span class="cwl-opp">${badge(o.badge)}<span>${esc(o.name)}</span></span>
          <span class="cwl-res">${r.state === "preparation" ? esc(r.teamSize ? r.teamSize + "v" + r.teamSize : "") : (u.stars || 0) + " \u2605 " + (o.stars || 0)} ${chip}</span></div>`;
      }).join("");
      for (let i = rounds.length + 1; i <= total; i++) {
        html += `<div class="cwl-row dim"><span class="cwl-r">R${i}</span><span class="cwl-opp"><span>Not started yet</span></span><span></span></div>`;
      }
      return html;
    }

    function thRosterHtml(members) {
      const groups = {};
      members.forEach(m => { (groups[m.townhallLevel] = groups[m.townhallLevel] || []).push(m); });
      const levels = Object.keys(groups).map(Number).sort((a, b) => b - a);
      const max = Math.max(1, ...levels.map(l => groups[l].length));
      return levels.map(l => {
        const list = groups[l].slice().sort((a, b) => (a.mapPosition || 99) - (b.mapPosition || 99));
        return `<div class="th-row">
          <img src="/assets/th/th${l}.png" alt="TH${l}" onerror="this.style.visibility='hidden'">
          <div>
            <div class="th-top">TH${l}<span>${list.length} ${list.length === 1 ? "player" : "players"}</span></div>
            <div class="th-bar"><i style="width:${Math.round(100 * list.length / max)}%"></i></div>
            <div class="th-names">${list.map(m => `<em>${esc(m.name)}</em>`).join("")}</div>
          </div>
        </div>`;
      }).join("");
    }

    const snap = {};     // clan mode -> { tag: {rank, stars, atk} }
    const deltas = {};   // clan mode -> { tag: {move, changed} }

    function perfSort(a, b) {
      return (b.totalStars || 0) - (a.totalStars || 0) || (b.avgDestruction || 0) - (a.avgDestruction || 0) || (a.mapPosition || 99) - (b.mapPosition || 99);
    }

    function trackChanges(m, d) {
      if (!d || !d.members) return;
      const ranked = d.members.slice().sort(perfSort);
      const cur = {};
      ranked.forEach((x, i) => { cur[x.tag] = { rank: i + 1, stars: x.totalStars || 0, atk: x.attacksUsed || 0 }; });
      const prev = snap[m], out = {};
      if (prev) ranked.forEach(x => {
        const a = prev[x.tag], b = cur[x.tag];
        if (!a) return;
        const move = a.rank - b.rank, changed = a.stars !== b.stars || a.atk !== b.atk;
        if (move || changed) out[x.tag] = { move, changed };
      });
      snap[m] = cur;
      deltas[m] = out;
    }

    const curDeltas = () => deltas[mode] || {};

    let sortMode = "auto";   // auto | performance | map
    let lastData = null;

    function effectiveSort(members) {
      if (sortMode !== "auto") return sortMode;
      return members.some(m => (m.attacksUsed || 0) > 0) ? "performance" : "map";
    }

    function membersHtml(members) {
      const mode = effectiveSort(members);
      const dl = curDeltas();
      const rows = members.slice().sort(mode === "performance" ? perfSort : (a, b) => (a.mapPosition || 99) - (b.mapPosition || 99));
      return `<table class="cwl-table"><thead><tr><th>#</th><th>Player</th><th>TH</th><th>Atk</th><th>\u2605</th><th>Avg dest.</th></tr></thead><tbody>
        ${rows.map((m, i) => {
          const n = mode === "performance" ? i + 1 : m.mapPosition;
          const dd = dl[m.tag] || {};
          const arrow = mode === "performance" && dd.move ? `<span class="mv ${dd.move > 0 ? "up" : "down"}">${dd.move > 0 ? "\u25b2" : "\u25bc"}${Math.abs(dd.move)}</span>` : "";
          return `<tr class="${dd.changed ? "flash" : ""}"><td class="${mode === "performance" && n <= 3 ? "rk" + n : ""}">${esc(n)}${arrow}</td>
          <td><div class="nm"><span>${esc(m.name)}</span></div></td>
          <td>${esc(m.townhallLevel)}</td><td>${m.attacksUsed || 0}/${m.roundsPlayed || 0}</td>
          <td>${m.totalStars || 0}</td><td>${(Number(m.avgDestruction) || 0).toFixed(0)}%</td></tr>`;
        }).join("")}
      </tbody></table>`;
    }

    function sortToggleHtml(members) {
      const mode = effectiveSort(members);
      return `<span class="cwl-sort"><button data-sort="performance" class="${mode === "performance" ? "active" : ""}">Performance</button><button data-sort="map" class="${mode === "map" ? "active" : ""}">Map order</button></span>`;
    }

    function render(d) {
      lastData = d;
      const view = document.getElementById("cwlView");
      if (!d) { view.innerHTML = `<div class="cwl-card"><div class="cwl-note">CWL data is unavailable right now. Please try again in a minute.</div></div>`; return; }
      if (d.configured === false) {
        view.innerHTML = `<div class="cwl-card"><div class="cwl-note">The ${mode} CWL clan hasn't been set up yet \u2014 it will appear here as soon as it's added.</div></div>`;
        return;
      }
      const inLeague = d.inLeague !== false && d.active !== false;
      if (!inLeague) {
        view.innerHTML = heroHtml(d, `<span class="cwl-chip">Off-season</span>`) +
          `<div class="cwl-card"><div class="cwl-note">CWL isn't running right now. Rounds and the roster appear here when the next season starts.<br>Looking for medal info? See the <a href="/cwl-bonus.html">CWL bonus guide</a>.</div></div>`;
        return;
      }
      const live = d.state === "inWar" || (d.rounds || []).some(r => r.state === "inWar");
      const extra = `<span class="cwl-chip ${live || d.state === "preparation" ? "live" : ""}">${esc(STATE_LABEL[d.state] || d.state || "Active")}</span>` +
        (d.season ? `<span class="cwl-chip">Season ${esc(d.season)}</span>` : "");
      view.innerHTML = heroHtml(d, extra) + `
        <div class="cwl-grid">
          <div class="cwl-col">
            <div class="cwl-card"><div class="cwl-card-title"><span>Rounds</span><span class="cwl-updated">${(d.rounds || []).length} of ${d.roundsTotal || 7}</span></div>${roundsHtml(d)}</div>
            <div class="cwl-card"><div class="cwl-card-title"><span>Town Hall roster</span><span class="cwl-updated">${(d.members || []).length} players</span></div>${thRosterHtml(d.members || [])}</div>
          </div>
          <div class="cwl-card"><div class="cwl-card-title"><span>Roster &amp; performance</span>${sortToggleHtml(d.members || [])}</div>${membersHtml(d.members || [])}</div>
        </div>`;
    }

    function isLive(d) {
      return !!d && d.inLeague !== false && d.active !== false &&
        (d.state === "inWar" || d.state === "preparation" || (d.rounds || []).some(r => r.state === "inWar" || r.state === "preparation"));
    }

    async function load(m, force, silent) {
      if (!force && cache[m]) { render(cache[m]); return; }
      if (!silent) document.getElementById("cwlView").innerHTML = `<div class="cwl-note">Loading CWL\u2026</div>`;
      try {
        const res = await fetch(API + m);
        if (!res.ok) throw new Error("bad status");
        cache[m] = await res.json();
        trackChanges(m, cache[m]);
      } catch (e) { if (!silent || !cache[m]) cache[m] = null; }
      if (m === mode) render(cache[m]);
      const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      document.getElementById("cwlUpdated").innerHTML = (isLive(cache[m]) ? '<span class="live-dot"></span>Live \u00b7 ' : "") + "Updated " + t;
    }

    const histCache = {};
    function seasonLabel(s) {
      const m = /^(\d{4})-(\d{2})/.exec(s || "");
      if (!m) return s || "Season";
      return new Date(+m[1], +m[2] - 1, 1).toLocaleString("en", { month: "long", year: "numeric" });
    }
    function histItem(s) {
      const rounds = (s.rounds || []).map(r => `
        <div class="cwl-row"><span class="cwl-r">R${esc(r.round)}</span>
          <div class="cwl-opp"><span>${esc(r.opponent || "Unknown")}</span></div>
          <div class="cwl-res"><span class="res ${esc(r.result)}">${esc(String(r.result || "").toUpperCase())}</span>${esc(r.usStars)}\u2605 \u2013 ${esc(r.oppStars)}\u2605</div></div>`).join("");
      const top = (s.members || []).slice().sort((a, b) => (b.totalStars || 0) - (a.totalStars || 0) || (b.avgDestruction || 0) - (a.avgDestruction || 0)).slice(0, 5)
        .map((m, i) => `<div class="hist-top"><b>${i + 1}</b><span>${esc(m.name)}${m.townHallLevel ? " \u00b7 TH" + esc(m.townHallLevel) : ""}</span><span class="s">${esc(m.totalStars || 0)}\u2605 \u00b7 ${esc(m.avgDestruction || 0)}%</span></div>`).join("");
      return `<details class="hist-item"><summary>${esc(seasonLabel(s.season))}
        <span class="hist-sum"><span class="res win">${esc(s.wins)}W</span><span class="res loss">${esc(s.losses)}L</span><span class="res tie">${esc(s.ties)}T</span><span class="res">${esc(s.stars)}\u2605</span></span></summary>
        <div class="hist-body"><div><p class="hist-sub">Rounds</p>${rounds}</div><div><p class="hist-sub">Top performers</p>${top || '<div class="cwl-note">No data</div>'}</div></div></details>`;
    }
    async function loadHistory(m) {
      const el = document.getElementById("cwlHistory");
      if (histCache[m] === undefined) {
        try {
          const r = await fetch(API + m + "/history");
          if (!r.ok) throw new Error("bad status");
          histCache[m] = (await r.json()).seasons || [];
        } catch (e) { histCache[m] = null; }
      }
      if (m !== mode) return;
      const s = histCache[m];
      if (s === null) { el.innerHTML = ""; return; }
      el.innerHTML = `<div class="cwl-card hist-card"><div class="cwl-card-title"><span>Past seasons</span><span class="cwl-updated">${s.length} saved</span></div>` +
        (s.length ? s.map(histItem).join("") : `<div class="cwl-note">Finished seasons are saved here automatically. The first one will appear when this season ends.</div>`) + `</div>`;
    }

    let timer;
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        if (!document.hidden) await load(mode, true, true);
        schedule();
      }, isLive(cache[mode]) ? 30000 : 300000);
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(mode, true, true); });

    document.getElementById("cwlView").addEventListener("click", e => {
      const b = e.target.closest(".cwl-sort button");
      if (!b || !lastData) return;
      sortMode = b.dataset.sort;
      render(lastData);
    });

    document.getElementById("cwlModes").addEventListener("click", e => {
      const b = e.target.closest(".cwl-mode");
      if (!b) return;
      mode = b.dataset.mode;
      document.querySelectorAll(".cwl-mode").forEach(x => x.classList.toggle("active", x === b));
      setAccent(mode);
      loadHistory(mode);
      load(mode, false).then(schedule);
    });

    setAccent(mode);
    loadHistory(mode);
    load(mode, true).then(schedule);
  })();
  </script>
  <script src="/visitor-counter.js" defer></script>
  <script src="/war-ticker.js" defer></script>
</body>
</html>
