  <style>
    .join-section {
      max-width: 640px;
    }

    .join-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-top: 8px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .join-box p {
      color: var(--text-dim);
      margin: 0 0 22px;
      font-size: 14.5px;
    }

    .join-btn {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14.5px;
      text-align: center;
      text-decoration: none;
      color: #0a0e1a;
      background: linear-gradient(135deg, var(--accent-fwa), var(--accent-fwa-2));
      box-shadow: 0 10px 24px rgba(255, 107, 0, .3);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(255, 107, 0, .4);
    }
