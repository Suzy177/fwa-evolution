<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join | FWA Evolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/stathut-v2.css">
  <link rel="icon" type="image/png" href="/assets/fwa-evolution-logo.png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GJLXJW3G7H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GJLXJW3G7H');
  </script>

  <style>
    .join-section {
      max-width: 640px;
    }

    .join-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-top: 8px;
      box-shadow: var(--shadow);
    }

    .join-box label {
      display: block;
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .join-box select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      appearance: none;
      cursor: pointer;
    }

    .join-box select:focus {
      outline: none;
      border-color: var(--accent-fwa);
    }

    .recommendation {
      margin-top: 22px;
      padding: 18px;
      border-left: 3px solid var(--accent-fwa);
      background: rgba(255, 156, 42, .08);
      border-radius: 0 10px 10px 0;
    }

    .recommendation strong {
      display: block;
      margin-bottom: 10px;
      font-size: 13.5px;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--text-dim);
    }

    .recommendation.hidden {
      display: none;
    }

    #clanList {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #clanList li {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    #clanList li:last-child {
      margin-bottom: 0;
    }

    #clanList img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      margin-right: 12px;
      object-fit: contain;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    #clanList a {
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    #clanList a:hover {
      color: var(--accent-fwa);
    }

    .join-btn {
      display: none;
      margin-top: 22px;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14.5px;
      text-align: center;
      text-decoration: none;
      color: #0a0e1a;
      background: linear-gradient(135deg, var(--accent-fwa), var(--accent-fwa-2));
      box-shadow: 0 10px 24px rgba(255, 107, 0, .3);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(255, 107, 0, .4);
    }
  </style>
</head>
<body class="sh2">

  <header class="sh2-topbar">
    <a href="/" class="sh2-logo"><img src="/assets/fwa-evolution-logo.png" alt="FWA Evolution">FWA Evolution</a>
    <nav class="sh2-nav">
      <a href="/">Home</a>
      <a href="/family.html">Family</a>
      <a href="/clans.html">Clans</a>
      <a href="/rules.html">Rules</a>
      <a href="/fwa-guide.html">Guide</a>
      <a href="/join.html" class="active">Join</a>
    </nav>
  </header>

  <section class="sh2-hero">
    <span class="sh2-eyebrow">Clan Family</span>
    <h1>Join FWA</h1>
    <p>Select your Town Hall level and we'll point you to the right FWA Evolution clan.</p>
  </section>

  <section class="sh2-section join-section">
    <div class="join-box">
      <label for="thSelect">Your Town Hall Level</label>
      <select id="thSelect">
        <option value="">Select Town Hall</option>
        <option value="10">TH10</option>
        <option value="11">TH11</option>
        <option value="12">TH12</option>
        <option value="13">TH13</option>
        <option value="14">TH14</option>
        <option value="15">TH15</option>
        <option value="16">TH16</option>
        <option value="17">TH17</option>
        <option value="18">TH18</option>
      </select>

      <div id="recommendation" class="recommendation hidden">
        <strong>Recommended Clans</strong>
        <ul id="clanList"></ul>
      </div>

      <a href="https://discord.gg/Svp5BxT" target="_blank" class="join-btn" id="joinBtn">Join via Discord →</a>
    </div>
  </section>

  <footer class="sh2-footer">
    <a href="https://stathut.in/">← Back to StatHut Home</a>
      <div class="sh2-visitor-stat" id="sh2VisitorStat"></div>
  </footer>

  <script>
    const thSelect = document.getElementById("thSelect");
    const recommendation = document.getElementById("recommendation");
    const clanList = document.getElementById("clanList");
    const joinBtn = document.getElementById("joinBtn");

    thSelect.addEventListener("change", () => {
      const th = parseInt(thSelect.value, 10);
      clanList.innerHTML = "";

      if (!th) {
        recommendation.classList.add("hidden");
        joinBtn.style.display = "none";
        return;
      }

      let clans = [];
      if (th >= 10 && th <= 11) { clans = ["#THE SHIELD#"]; }
      else if (th === 12) { clans = ["InvidiaBandit"]; }
      else if (th >= 13 && th <= 18) { clans = ["Vi11ageWarriors"]; }
      else { clans = ["#THE SHIELD#", "InvidiaBandit", "Vi11ageWarriors"]; }

      const DISCORD_LINK = "https://discord.gg/Svp5BxT";
      const clanLogos = {
        "#THE SHIELD#": "/assets/badges/shield.png.png",
        "InvidiaBandit": "/assets/badges/nvidiabandit.png.png",
        "Vi11ageWarriors": "/assets/badges/villagewarriors.png.png"
      };

      clans.forEach(clan => {
        const li = document.createElement("li");

        const img = document.createElement("img");
        img.src = clanLogos[clan];
        img.alt = clan + " logo";
        img.onerror = () => { console.error("Logo not found:", img.src); img.style.display = "none"; };

        const a = document.createElement("a");
        a.textContent = clan;
        a.href = DISCORD_LINK;
        a.target = "_blank";

        li.appendChild(img);
        li.appendChild(a);
        clanList.appendChild(li);
      });

      recommendation.classList.remove("hidden");
      joinBtn.style.display = "inline-block";
    });
  </script>

  <script src="/visitor-counter.js" defer></script>
</body>
</html>
